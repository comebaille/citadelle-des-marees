<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#0d2c54"/>
      <stop offset="55%" stop-color="#06162d"/>
      <stop offset="100%" stop-color="#030916"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#4df7ff"/>
      <stop offset="75%" stop-color="#00b4d8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ef7ff"/>
      <stop offset="45%" stop-color="#19729c"/>
      <stop offset="100%" stop-color="#0a2542"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38f9b4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle bathymetric rings -->
  <circle cx="256" cy="240" r="196" fill="none" stroke="#1d5b85" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 10"/>
  <circle cx="256" cy="240" r="144" fill="none" stroke="#2ef2ff" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Luminous core halo -->
  <circle cx="256" cy="222" r="118" fill="url(#core)" opacity="0.55"/>

  <!-- Flanking sunken pillars -->
  <path d="M138 358 L154 236 L176 218 L184 358 Z" fill="#0d2a49" stroke="#2ef2ff" stroke-opacity="0.45" stroke-width="3"/>
  <path d="M374 358 L358 236 L336 218 L328 358 Z" fill="#0d2a49" stroke="#2ef2ff" stroke-opacity="0.45" stroke-width="3"/>

  <!-- Central Citadel Spire -->
  <path d="M256 76 L296 184 L318 362 L194 362 L216 184 Z" fill="url(#spire)" stroke="#7cf9ff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M256 106 L278 192 L288 340 L224 340 L234 192 Z" fill="#071d36" opacity="0.72"/>

  <!-- Bioluminescent Crystal Heart -->
  <polygon points="256,162 288,220 256,278 224,220" fill="#2ef2ff" filter="url(#glow)"/>
  <polygon points="256,180 274,220 256,260 238,220" fill="#e6ffff"/>

  <!-- Tidal waves -->
  <path d="M72 346 Q164 306 256 346 T440 346" fill="none" stroke="url(#wave1)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M96 392 Q176 360 256 392 T416 392" fill="none" stroke="#2ef2ff" stroke-opacity="0.65" stroke-width="7" stroke-linecap="round"/>
  <path d="M142 430 Q198 408 256 430 T370 430" fill="none" stroke="#c77dff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>

  <!-- Bioluminescent plankton sparks -->
  <circle cx="136" cy="148" r="7" fill="#38f9b4" filter="url(#glow)"/>
  <circle cx="384" cy="164" r="6" fill="#2ef2ff" filter="url(#glow)"/>
  <circle cx="352" cy="112" r="4" fill="#ffb84d"/>
  <circle cx="172" cy="112" r="4" fill="#c77dff"/>
</svg>
